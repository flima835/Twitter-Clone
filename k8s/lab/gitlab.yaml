# GitLab CE (lab) - pod único (Omnibus) com configuração enxuta.
# __GITLAB_EXTERNAL_URL__ é substituído por scripts/lab/50-gitlab.sh (var LAB_GITLAB_URL).
# Secret `gitlab-root` (senha do usuário root) é criado pelo mesmo script.
# O primeiro boot leva 5-10 min; precisa de ~4 GiB de RAM livres.
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
  labels: {app: gitlab}
spec:
  selector: {app: gitlab}
  ports:
    - {name: http, port: 80, targetPort: 80}
    - {name: ssh, port: 22, targetPort: 22}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  namespace: gitlab
  labels: {app: gitlab}
spec:
  serviceName: gitlab
  replicas: 1
  selector:
    matchLabels: {app: gitlab}
  template:
    metadata:
      labels: {app: gitlab}
    spec:
      enableServiceLinks: false
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: gitlab-root, key: password}
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url '__GITLAB_EXTERNAL_URL__'
                nginx['listen_port'] = 80
                nginx['listen_https'] = false
                puma['worker_processes'] = 0
                sidekiq['max_concurrency'] = 10
                prometheus_monitoring['enable'] = false
          ports:
            - {name: http, containerPort: 80}
            - {name: ssh, containerPort: 22}
          startupProbe:
            httpGet: {path: /users/sign_in, port: 80}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /users/sign_in, port: 80}
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 3Gi}
            limits: {memory: 6Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/gitlab}
            - {name: logs, mountPath: /var/log/gitlab}
            - {name: data, mountPath: /var/opt/gitlab}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 10Gi}
