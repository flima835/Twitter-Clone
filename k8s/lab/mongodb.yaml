# MongoDB (lab) - instância única com autenticação (usuário admin).
# Secret `mongodb-auth` é criado por scripts/lab/10-datastores.sh
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: lab-data
  labels: {app: mongodb}
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports:
    - {name: mongodb, port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: lab-data
  labels: {app: mongodb}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongodb-auth, key: password}
          ports:
            - {name: mongodb, containerPort: 27017}
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 2Gi}
