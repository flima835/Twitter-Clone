apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twitter-clone
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: twitter-clone
  source:
    repoURL: 'https://github.com/flima835/Twitter-Clone.git'
    targetRevision: master
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
