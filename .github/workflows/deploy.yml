name: Build e Deploy (GitOps com ArgoCD)

on:
  push:
    branches: [ master ]
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  build-and-update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Autenticacao na GCP usando o Secret que voce criou
      - name: Auth GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Build da Imagem no Artifact Registry (contexto agora e so a pasta app/)
      - name: Build and Push Image
        working-directory: app
        run: |
          IMAGE="us-central1-docker.pkg.dev/twitter-clone-sre/repo-clone/app:${{ github.sha }}"
          gcloud builds submit --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # Em vez de dar 'kubectl set image' direto no cluster, atualizamos o
      # manifesto no Git. O ArgoCD, que fica monitorando o repo, detecta essa
      # mudanca e sincroniza o cluster sozinho (GitOps).
      - name: Update image tag in manifest (GitOps)
        run: |
          sed -i "s|image: .*repo-clone/app:.*|image: ${IMAGE}|" k8s/base/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/deployment.yaml
          git commit -m "ci: atualiza imagem para ${{ github.sha }}" || echo "Nada para commitar"
          git push

      - name: Info
        run: echo "O ArgoCD vai detectar a mudanca em k8s/base/deployment.yaml e sincronizar o cluster automaticamente."
