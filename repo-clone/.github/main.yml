name: Twitter Clone CI-CD

on:
  push:
    branches: [ main ] # Dispara quando você der push na main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Autenticação na GCP usando o Secret que você criou
      - name: Auth GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # Build da Imagem no Artifact Registry
      - name: Build and Push Image
        run: |
          gcloud builds submit --tag us-central1-docker.pkg.dev/twitter-clone-sre/repo-clone/app:${{ github.sha }} .

      # Deploy no Kubernetes
      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: twitter-clone-cluster
          location: us-central1-a

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/twitter-app twitter-container=us-central1-docker.pkg.dev/twitter-clone-sre/repo-clone/app:${{ github.sha }}
